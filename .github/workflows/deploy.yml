name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: "22"
        env:
          # Set a repository variable named CUSTOM_DOMAIN (Settings →
          # Secrets and variables → Actions → Variables) once the domain
          # is purchased; also add it under Settings → Pages.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
